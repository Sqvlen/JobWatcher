<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!-- JobWatcher bot avatar. Idea: an eye (it watches job boards) whose pupil is a paper plane (it sends to Telegram);
       the yellow spark is "a new vacancy". Colours: .NET purple fading into Telegram blue.
       Telegram shows avatars as a circle, so everything important stays inside r=200 of the centre. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5E2BD9"/>
      <stop offset="0.55" stop-color="#3D45DB"/>
      <stop offset="1" stop-color="#1FA2E0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sclera" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE6FF"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A2BB8"/>
      <stop offset="0.75" stop-color="#241784"/>
      <stop offset="1" stop-color="#150E5C"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="eyeClip">
      <path d="M66 256 Q256 92 446 256 Q256 420 66 256 Z"/>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- radar rings: the "watching" feel -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3">
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="205"/>
    <circle cx="256" cy="256" r="260"/>
  </g>

  <!-- the eye -->
  <g filter="url(#shadow)">
    <path d="M66 256 Q256 92 446 256 Q256 420 66 256 Z" fill="url(#sclera)"/>
  </g>
  <g clip-path="url(#eyeClip)">
    <circle cx="256" cy="256" r="62" fill="url(#iris)"/>
    <circle cx="256" cy="256" r="62" fill="none" stroke="#6C8BFF" stroke-opacity="0.55" stroke-width="3"/>
    <!-- upper-lid shading -->
    <path d="M66 256 Q256 92 446 256 L446 190 L66 190 Z" fill="#8FA6E8" fill-opacity="0.18"/>
  </g>
  <path d="M66 256 Q256 92 446 256 Q256 420 66 256 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="4" stroke-linejoin="round"/>

  <!-- paper plane as the pupil -->
  <g transform="translate(256 256) rotate(-6) scale(1.3)">
    <path d="M-34 -2 L36 -30 L16 30 L-3 12 Z" fill="url(#plane)"/>
    <path d="M-3 12 L-15 27 L-15 7 Z" fill="#9DB9F2"/>
    <path d="M36 -30 L-15 8" stroke="#241784" stroke-opacity="0.35" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
  <circle cx="222" cy="222" r="7.5" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- spark = new vacancy -->
  <g transform="translate(398 128) scale(1.1)">
    <path d="M0 -30 Q4 -4 30 0 Q4 4 0 30 Q-4 4 -30 0 Q-4 -4 0 -30 Z" fill="#FFD43B"/>
    <circle cx="26" cy="-26" r="5" fill="#FFD43B" fill-opacity="0.85"/>
    <circle cx="-24" cy="26" r="3.5" fill="#FFD43B" fill-opacity="0.7"/>
  </g>
</svg>
