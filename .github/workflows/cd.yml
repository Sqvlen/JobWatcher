name: CD – Test, Build, Push to GHCR & Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "JobWatcher.sln"
      - ".github/workflows/cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "JobWatcher.sln"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore JobWatcher.sln

      - name: Build
        run: dotnet build JobWatcher.sln --no-restore -c Release

      - name: Test
        run: dotnet test JobWatcher.sln --no-build -c Release --verbosity normal

  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR accepts lower-case names only, and the repository owner may have capitals.
      # The deploy job pulls this exact, immutable tag (never "latest"), so a rollback is just an older tag.
      - name: Image reference
        id: ref
        run: |
          name="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA::7}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${name}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ref.outputs.name }}
          tags: |
            type=raw,value=${{ steps.ref.outputs.tag }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # The Droplet is x86_64. The Dockerfile runs its build stage on the runner's own platform, so this needs no emulation.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jobwatcher
          cache-to: type=gha,scope=jobwatcher,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy to Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The secrets below may live in this environment (Settings > Environments), where required reviewers can be added.
    environment: production
    permissions:
      contents: read
      packages: read
    # JobWatcher must run as exactly one instance, so two deploys never overlap and a running one is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The key is restricted on the server to one command (deploy/deploy.sh), which takes the image and the registry
      # user as arguments and reads the registry token from stdin. The token is this run's GITHUB_TOKEN: it is never
      # stored on the server and stops working when the run ends.
      - name: Deploy
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "${IMAGE} ${GITHUB_ACTOR}"
